<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CC Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#F7F2EA;--card:#FFFDF9;--ink:#2E2326;--soft:#7A6A66;--red:#7A3E36;--line:#E6DBCF}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.5 Jost,system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:28px 16px 48px}
.k{font:500 11px/1 Jost,sans-serif;letter-spacing:.24em;text-transform:uppercase;color:var(--red)}
h1{font:600 44px/1 'Cormorant Garamond',serif;margin:8px 0 6px}p.lead{color:var(--soft);margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
a.card,div.card{display:flex;flex-direction:column;gap:6px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:inherit;text-decoration:none}
a.card:hover{border-color:var(--red)}.card svg{width:28px;height:28px;fill:none;stroke:var(--red);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.card b{font:600 22px/1.1 'Cormorant Garamond',serif}.card span{font-size:13px;color:var(--soft)}.card em{font-style:normal;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
div.card{opacity:.6}
</style>
</head>
<body><main>
<div class="k">CC Notes</div>
<h1>Notes</h1>
<p class="lead">Cece's study space, one project per page.</p>
<div class="grid">
<a class="card" href="/3d-jewelry/"><svg viewBox="0 0 24 24"><path d="M12 21C8 16.5 6.5 12.5 6.5 9.5a5.5 5.5 0 0 1 11 0c0 3-1.5 7-5.5 11.5z"/><path d="M12 3v3"/></svg><b>3D Jewelry</b><span>Pendant Lab: charms, pendants and signets in 3D, with chains and try-on.</span><em>Live</em></a>
<div class="card"><svg viewBox="0 0 24 24"><rect x="3" y="14" width="18" height="6" rx="1.5"/><path d="M8 14V8h8v6M12 8V3M12 3l-2 2M12 3l2 2"/></svg><b>Laser Machines</b><span>Notes on engraving lasers, samples and settings.</span><em>Coming</em></div>
<div class="card"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="10" rx="1.5"/><rect x="13" y="3" width="8" height="6" rx="1.5"/><rect x="13" y="11" width="8" height="10" rx="1.5"/><rect x="3" y="15" width="8" height="6" rx="1.5"/></svg><b>Moodboard</b><span>Saved pictures and references in one place.</span><em>Coming</em></div>
</div>
</main></body></html>
